name: Nodebucket checks and Azure deploy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodebucket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --audit-level=low
      - run: npm audit --prefix server --audit-level=low
      - run: npm run test:server
      - run: npm run test:ui
      - run: npm run build
      - name: Compile infrastructure template
        run: az bicep build --file infra/main.bicep --outfile /tmp/nodebucket-arm.json
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: nodebucket
          path: nodebucket.zip
          retention-days: 3

  deploy:
    needs: checks
    # Disabled until signup, provisioning, and repository variables are complete.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodebucket
      - run: unzip -q nodebucket.zip -d release
      - uses: Azure/static-web-apps-deploy@v1
        id: webapp
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: release/dist/nodebucket
          api_location: release/server
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify the deployed app can reach Cosmos DB
        env:
          APP_URL: ${{ steps.webapp.outputs.static_web_app_url }}
        run: |
          app_base="${APP_URL%/}"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$app_base/api/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "The deployed app did not become healthy."
          exit 1
