name: Nodebucket checks and Azure deploy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodebucket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run test:server
      - run: npm run build
      - name: Compile infrastructure template
        run: az bicep build --file infra/main.bicep --outfile /tmp/nodebucket-arm.json
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: nodebucket
          path: nodebucket.zip
          retention-days: 3

  deploy:
    needs: checks
    # Disabled until signup, provisioning, and repository variables are complete.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodebucket
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: webapp
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: nodebucket.zip
      - name: Verify the deployed app can reach Cosmos DB
        env:
          APP_URL: ${{ steps.webapp.outputs.webapp-url }}
        run: |
          app_base="${APP_URL%/}"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$app_base/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "The deployed app did not become healthy."
          exit 1
