<h2 mat-dialog-title>{{ dialogData.header }}</h2>
<div mat-dialog-content>
  <p>{{ dialogData.content }}</p>
  <p class="delete-warning">This action cannot be undone.</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button matDialogClose="cancel" cdkFocusInitial>Keep task</button
  ><button mat-flat-button matDialogClose="confirm" color="warn">
    Delete task
  </button>
</div>
