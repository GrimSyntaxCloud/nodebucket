<div class="workspace-shell">
  <a class="skip-link" href="#main-content" (click)="focusContent($event)"
    >Skip to content</a
  >
  <header class="workspace-nav">
    <a class="brand" routerLink="/" aria-label="Nodebucket home"
      ><span class="brand-mark" aria-hidden="true">n</span>nodebucket<span
        class="studio-label"
        >WORKSPACE</span
      ></a
    >
    <nav aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >My board</a
      >
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
    <button class="logout" (click)="logout()">
      Log out <span aria-hidden="true">↗</span>
    </button>
  </header>
  <main id="main-content" tabindex="-1" #mainContent>
    <router-outlet></router-outlet>
  </main>
  <footer>
    <span>Small steps. Real progress.</span
    ><span
      >© {{ year | date: "yyyy" }} Nodebucket ·
      <a
        href="https://www.bellevue.edu/"
        target="_blank"
        rel="noopener noreferrer"
        >Bellevue University project</a
      ></span
    >
  </footer>
</div>
