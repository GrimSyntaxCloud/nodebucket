<div class="layout-column center">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="card-header-color">
        Try the Nodebucket demo
      </mat-card-title>

      <mat-card-subtitle >
        Enter demo ID 1007. This board is shared by all visitors; use sample tasks only.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <app-messages [(value)]="errorMessages" [enableService]="false"></app-messages>

      <mat-card class="layout-column gap-10 mat-elevation-z0">
        <form [formGroup]="loginForm" (ngSubmit)="login(); loginForm.reset();">

          <mat-card-content class="mat-elevation-z0">
            <mat-form-field appearance="fill" style="width:100%;">
              <input type="text" matInput formControlName="empId" aria-label="Demo employee ID" placeholder="Employee ID">

              <mat-error
                *ngIf="loginForm.controls['empId'].hasError('required') && loginForm.controls['empId'].touched">
                Employee ID is a required field.
              </mat-error>

              <mat-error *ngIf="loginForm.controls['empId'].hasError('pattern') && loginForm.controls['empId'].touched">
                Employee ID must be a numerical value.
              </mat-error>
            </mat-form-field>
          </mat-card-content>
        </form>
      </mat-card>
    </mat-card-content>

    <mat-card-actions>
      <button type="submit" mat-raised-button color="primary" style="height: 50px; font-size: 18px;"
        [disabled]="!loginForm.valid" (click)="login();" class="flex-grow">Open demo</button>
    </mat-card-actions>
  </mat-card>
</div>
